<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heads Up: read reviews from people who lived there</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0E3B3A; --primary-ink:#ffffff; --surface:#E7F1EF; --accent:#F2A900; --accent-ink:#2A1E00;
  --bg:#F6F8F8; --card:#ffffff; --text:#12201F; --muted:#546664; --line:#D7E0DF;
  --good:#1E8A4C; --mixed:#B97A00; --bad:#C8372D;
  --brand:#0E3B3A; --on-brand:#fff; --field:#fff; --gb:var(--gb); --gt:var(--gt); --mb:var(--mb); --mt:var(--mt); --bb:var(--bb); --bt:var(--bt); --db:var(--db); --sb:var(--sb); --rb:var(--rb); --dis-bg:var(--dis-bg); --dis-tx:var(--dis-tx); --toast:#12201F;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme=dark]{color-scheme:dark;--bg:#0B1514;--card:#12201F;--field:#0D1918;--text:#E6EEED;--muted:#9DB2AF;--line:#27403D;--surface:#1B3633;--brand:#6FD6CE;--on-brand:#0B1514;--gb:#16382A;--gt:#7FDCA4;--mb:#3B2D0A;--mt:#F2C75C;--bb:#40201D;--bt:#F59A93;--db:#3B2D0A;--sb:#1D2B2A;--rb:#241E0D;--dis-bg:#142120;--dis-tx:#5E7370;--toast:#2A4340}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.55 var(--body)}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0;letter-spacing:-.01em}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.sr{position:absolute;left:-9999px}
[hidden]{display:none!important}

header.top{background:var(--primary);color:var(--primary-ink);position:relative;z-index:50}
header.top .wrap{position:relative}
#menu .themebtn{background:none;border:0;color:inherit;text-align:left;padding:12px 14px;font-size:1.02rem;font-weight:500;border-radius:8px;cursor:pointer;opacity:.9}#menu .themebtn:hover{background:rgba(255,255,255,.14);opacity:1}
.menuwrap{position:relative;flex:none}
.menu-btn{box-sizing:border-box;padding:0;line-height:0;background:none;border:1.5px solid rgba(255,255,255,.35);color:inherit;border-radius:10px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
.menu-btn:hover{background:rgba(255,255,255,.14)}.menu-btn svg{width:22px;height:22px}
#menu{display:none;position:absolute;right:0;top:calc(100% + 8px);flex-direction:column;gap:2px;min-width:230px;background:var(--primary);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:8px;box-shadow:0 12px 32px rgba(0,0,0,.3)}
#menu.open{display:flex}#menu a{padding:12px 14px;font-size:1.02rem}#menu a.cta{margin-top:6px;text-align:center}
.about p{max-width:40em;margin:0 0 14px;line-height:1.65}.about h2{font-size:1.3rem;margin:28px 0 8px}.about .lead{font-size:1.25rem;font-weight:600;max-width:30em;margin:10px 0 0}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font:800 1.35rem var(--head);text-decoration:none}
.logo svg{width:30px;height:30px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{text-decoration:none;padding:8px 11px;border-radius:8px;font-weight:500;opacity:.9}
nav a:hover,nav a.on{background:rgba(255,255,255,.14);opacity:1}
nav a.cta{background:var(--accent);color:var(--accent-ink);font-weight:600;opacity:1}

.hero{background:var(--primary);color:var(--primary-ink);padding:72px 0 96px;min-height:70vh}
.hero .wrap{text-align:center}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.6rem);font-weight:800;max-width:13em;margin:0 auto 10px}
.hero .sub{font-size:clamp(1.05rem,2.4vw,1.35rem);opacity:.9;margin:0 auto 30px;max-width:30em}
.btn{border:0;border-radius:9px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(.95)}
.btn.sec{background:var(--surface);color:var(--brand)}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--text)}
.search{background:var(--card);color:var(--text);border-radius:14px;padding:16px;display:grid;gap:12px;max-width:560px;margin:0 auto;text-align:left}
.search label{font-size:.85rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.search input,.search select,.loc select,.loc input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--field);color:var(--text)}
select:disabled{background:var(--dis-bg);color:var(--dis-tx);cursor:not-allowed}
.locs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.locs label{font-size:.85rem;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
.locs select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--field)}
.near{background:var(--surface);color:var(--brand);border:0;border-radius:9px;padding:10px 14px;font-weight:600;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.85rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

.ring{--p:70;--c:var(--good);width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:800 1.1rem var(--head)}
.ring.big{width:104px;height:104px}.ring.big span{width:84px;height:84px;font-size:1.9rem}
.ring.new{background:var(--line)}.ring.new span{font-size:.85rem;color:var(--muted)}.ring.big.new span{font-size:1.1rem}
.good{--c:var(--good)}.mixed{--c:var(--mixed)}.bad{--c:var(--bad)}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.82rem;font-weight:600;background:var(--surface);color:var(--brand)}
.pill.good{background:var(--gb);color:var(--gt)}.pill.mixed{background:var(--mb);color:var(--mt)}.pill.bad{background:var(--bb);color:var(--bt)}
.pill.draft{background:var(--db);color:var(--mt)}.pill.sample{background:var(--sb);color:var(--muted)}
.verified{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:600;color:var(--gt);background:var(--gb);border-radius:99px;padding:3px 10px}
.verified svg{width:14px;height:14px}

.tl{list-style:none;margin:10px 0 0;padding:0 0 0 18px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 12px 12px;font-size:.93rem}
.tl li::before{content:"";position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.tl b{display:block;font-size:.82rem;color:var(--muted);font-weight:600}
.tl li.bad::before{background:var(--bad)}.tl li.good::before{background:var(--good)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.photo{aspect-ratio:16/9;overflow:hidden;background:var(--line)}
.photo svg,.photo img{display:block;width:100%;height:100%;object-fit:cover}
.card .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-size:1.2rem}
.meta{color:var(--muted);font-size:.92rem}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:10px}
.card a.open{font-weight:600;color:var(--brand);text-decoration:none}
.card a.open:hover{text-decoration:underline}
.empty{grid-column:1/-1;padding:28px;border:1.5px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.empty a{color:var(--brand);font-weight:600}
.dist{font-size:.85rem;font-weight:600;color:var(--brand)}
.page{padding:8px 0 64px}

.tools{margin:14px 0 22px;display:grid;gap:10px}
.tools .top{display:flex;gap:10px 14px;align-items:flex-end;flex-wrap:wrap}
.mini{font-size:.75rem;font-weight:600;color:var(--muted);display:block;margin-bottom:3px}
.tools select,.tools input{border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;font-size:.92rem;background:var(--field);color:var(--text)}
.tools input{width:105px}
.tools .val{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.tools .add{padding:8px 16px;font-size:.92rem}
.tools .count{margin-left:auto;font-weight:600;font-size:.92rem}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--surface);color:var(--brand);border-radius:99px;padding:4px 4px 4px 12px;font-size:.85rem;font-weight:600}
.chip button{flex:none;display:grid;place-items:center;box-sizing:border-box;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:color-mix(in srgb,currentColor 16%,transparent);color:inherit;cursor:pointer;line-height:0}
.chip button:hover{background:color-mix(in srgb,currentColor 30%,transparent)}
.clearall{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:22px;counter-reset:s}
.steps div{background:var(--card);border-radius:14px;padding:20px;counter-increment:s}
.steps div::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-brand);font:800 1rem var(--head);margin-bottom:12px}
.steps h3{font-size:1.1rem;margin-bottom:6px}
.steps p{margin:0;color:var(--muted)}
.how{background:var(--surface);padding:24px 0 56px}

.back{display:inline-block;margin:24px 0 8px;font-weight:600;color:var(--brand);text-decoration:none}
.d-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.d-head h1{font-size:clamp(1.8rem,4vw,2.6rem)}
.d-grid{display:grid;grid-template-columns:1fr 330px;gap:28px;align-items:start}
.strip{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:8px;margin-bottom:12px;height:300px}
.strip .photo{aspect-ratio:auto;border-radius:12px;height:100%}
.strip .photo:first-child{grid-row:span 2}
.strip.n1{grid-template-columns:1fr;grid-template-rows:1fr}.strip.n1 .photo:first-child{grid-row:auto}
.strip.n2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}.strip.n2 .photo:first-child{grid-row:auto}
details.more{margin-bottom:22px}details.more summary{cursor:pointer;font-weight:600;color:var(--brand)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.gal .photo{border-radius:10px;aspect-ratio:4/3}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.rooms{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.rooms li{display:flex;justify-content:space-between;gap:10px;font-size:.93rem;border-bottom:1px solid var(--line);padding-bottom:6px}
.bars{display:grid;gap:12px;margin-top:12px}
.bar{display:grid;grid-template-columns:90px 1fr 30px;align-items:center;gap:10px;font-size:.92rem}
.bar i{height:8px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--brand);border-radius:9px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.rev header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rev .who{font-weight:600}
.rev .acts{display:flex;gap:12px;margin-top:10px;align-items:center;flex-wrap:wrap}
.rev .acts button,.linkbtn{background:none;border:0;color:var(--muted);cursor:pointer;text-decoration:underline;padding:4px 0}
.rev .acts .ok{color:var(--gt);font-weight:600}.rev .acts .del{color:var(--bad)}
.note{font-size:.88rem;color:var(--muted)}
.reply{margin-top:12px;padding:12px;border-left:3px solid var(--accent);background:var(--rb);border-radius:0 8px 8px 0;font-size:.93rem}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs>div{position:relative}
.thumbs img{width:90px;height:68px;object-fit:cover;border-radius:8px;display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;padding:0;display:grid;place-items:center;border-radius:50%;border:0;background:var(--text);color:var(--bg);cursor:pointer;line-height:0}

.form{max-width:720px;margin:24px auto 64px;display:grid;gap:20px}
.field{display:grid;gap:6px}
.field label,.field legend{font-weight:600}
.field input[type=text],.field input[type=month],.field select,.field textarea{border:1.5px solid var(--line);border-radius:9px;padding:11px 12px;background:var(--field);width:100%}
.field textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rate{display:grid;grid-template-columns:100px 1fr 24px;gap:10px;align-items:center}
.rate input{accent-color:var(--brand)}
.upload{border:1.5px dashed var(--line);border-radius:12px;padding:16px;background:var(--field)}
.lock{display:flex;gap:8px;align-items:start;margin-top:8px;font-size:.9rem;color:var(--muted)}
.tlrow{display:grid;grid-template-columns:150px 1fr;gap:8px;margin-bottom:8px}
.tlrow input,.roomrow input,.roomrow select{border:1.5px solid var(--line);border-radius:9px;padding:10px;background:var(--field);width:100%}
.roomrow{display:grid;grid-template-columns:1fr 170px;gap:8px;margin-bottom:8px}
.amgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.amgrid label{display:flex;gap:8px;align-items:center;font-weight:500}
.amgrid input{accent-color:var(--brand);width:18px;height:18px}
fieldset{border:0;padding:0;margin:0}

.yrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-top:8px}.yrs label{font-size:.85rem}.yrs input,#editor select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px}
dialog{background:var(--card);color:var(--text);border:0;border-radius:16px;padding:22px;max-width:460px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,20,.5)}
dialog h3{font-size:1.3rem;margin-bottom:6px}
dialog textarea{width:100%;min-height:110px;border:1.5px solid var(--line);border-radius:9px;padding:10px;margin:12px 0}
dialog .row{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--toast);color:#fff;padding:12px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;z-index:20}
#toast.on{opacity:1;transform:translateX(-50%)}

footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--muted);font-size:.88rem}
footer .ft{display:flex;gap:8px 18px;flex-wrap:wrap;align-items:center;margin-top:8px}
footer label{display:flex;gap:6px;align-items:center}

@media(max-width:820px){
  .d-grid{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}
  .locs{grid-template-columns:1fr}
  .strip{height:240px}
  .two,.tlrow,.roomrow{grid-template-columns:1fr}
  .hero{min-height:0;padding:44px 0 64px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#home" aria-label="Heads Up home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M4 5h24a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H15l-6 5v-5H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="#F2A900"/><rect x="14.2" y="9" width="3.6" height="7" rx="1.8" fill="#2A1E00"/><circle cx="16" cy="19.2" r="2" fill="#2A1E00"/></svg>
      Heads Up
    </a>
    <div class="menuwrap"><button class="menu-btn" id="mbtn" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <nav id="menu" aria-label="Main">
      <a href="#home" data-nav="home">Find a hostel</a>
      <a href="#add" data-nav="add">Add a hostel</a>
      <a href="#how" data-nav="how">How it works</a>
      <a href="#about" data-nav="about">About us</a>
      <a href="#admin" id="adminLink" data-nav="admin" hidden>Review queue</a>
      <button type="button" class="themebtn" id="auth" hidden></button>
      <button type="button" class="themebtn" id="theme"></button>
      <a href="#review" class="cta" data-nav="review">Write a review</a>
    </nav></div>
  </div>
</header>

<main id="view"></main>

<footer>
  <div class="wrap">
    <div>Draft. Everything you add saves on this device only.</div>
    <div class="ft">
      <label><input type="checkbox" id="oOwn"> Owner mode</label>
      <label><input type="checkbox" id="oHide"> Hide sample hostels</label>
      <button type="button" class="linkbtn" id="oExp">Export data</button>
      <button type="button" class="linkbtn" id="oImp">Import data</button>
      <button type="button" class="linkbtn" id="oRst">Reset my data</button>
      <input type="file" id="impF" accept="application/json,.json" hidden>
    </div>
  </div>
</footer>

<dialog id="challenge">
  <form method="dialog" id="challengeForm">
    <h3>Challenge this review</h3>
    <p class="note">Tell us why you think it is not genuine. The review stays visible while we check it, and we decide within 5 days.</p>
    <label class="sr" for="cWhy">Why is this review not genuine?</label>
    <textarea id="cWhy" placeholder="For example: this person was never a tenant. Attach proof from your tenancy records."></textarea>
    <div class="row">
      <button class="btn ghost" value="cancel" type="button" id="cCancel">Cancel</button>
      <button class="btn" value="send" id="cSend">Send challenge</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script>
/* ---------- Basics ---------- */
const $=(s,r=document)=>r.querySelector(s);
const view=$('#view');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const naira=n=>'₦'+Number(n).toLocaleString('en-NG');
const num=v=>parseInt(String(v).replace(/\D/g,''),10)||0;
const cls=s=>s===null?'new':s>=75?'good':s>=50?'mixed':'bad';
const label=s=>s===null?'No reviews yet':s>=75?'Trusted':s>=50?'Mixed reviews':'Be careful';
const km=(a,b,c,d)=>{const r=x=>x*Math.PI/180,R=6371,dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const NEAR_KM=25;
function getPos(ok,bad){
  const fail=m=>{toast(m);if(bad)bad()};
  if(!navigator.geolocation)return fail('This browser cannot share location. Pick a state and area instead.');
  const blocked='Location is blocked. Allow it for this page in your browser settings, then try again.';
  const go=(hi,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:hi,timeout:hi?15000:8000,maximumAge:300000});
  go(false,e=>{
    if(e.code===1)return fail(blocked);
    go(true,e2=>fail(e2.code===1?blocked:'Could not find you. Turn on location on your device, or pick a state and area instead. Some browsers block location on files saved to your computer.'));
  });
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),3800)}

const ROOM_TYPES=['Single room','Self-contain','Room and parlour','Mini flat','One-bedroom flat','Two-bedroom flat','Three-bedroom flat','Four-bedroom flat','Duplex','Shared room, 2 per room','Shared room, 4 per room','Shared room, 6 or more per room','Other'];
const AM={Water:'24/7 water',Power:'Power backup',Gate:'Security gate',Fence:'Fenced compound',Kitchen:'Shared kitchen',Wifi:'Wi-Fi'};

const idb=(()=>{try{const p=new Promise((res,rej)=>{const q=indexedDB.open('headsup',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});p.catch(()=>{});return p}catch(e){return Promise.reject(e)}})();
const kvGet=k=>idb.then(db=>new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const kvSet=(k,v)=>idb.then(db=>new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)}));
function mergeAreas(){DB.hostels.concat(CL.hostels).forEach(h=>{LOC[h.st]=LOC[h.st]||{};LOC[h.st][h.rg]=LOC[h.st][h.rg]||[];if(!LOC[h.st][h.rg].includes(h.ar))LOC[h.st][h.rg].push(h.ar)})}
function setDB(v){DB={hostels:[],reviews:{},edits:{},...v,settings:{owner:false,hideSamples:false,...(v&&v.settings)}};mergeAreas()}
async function load(){try{const v=await kvGet('db');if(v)setDB(v)}catch(e){canSave=false}}

}

/* ---------- Shared backend functions ---------- */
async function cloudLoad(){
  const [h,r]=await Promise.all([sb.from('hostels').select('id,data,status,user_id'),sb.from('reviews').select('id,hostel_id,data,status')]);
  if(h.error||r.error){toast('Could not load shared hostels. Check your connection.');return}
  CL.hostels=h.data.filter(x=>x.status!=='rejected').map(x=>({t:TINTS[0],photos:[],amen:[],rooms:[],...x.data,id:x.id,mine:true,cloud:true,status:x.status,uid:x.user_id,reviews:[]}));
  CL.reviews={};
  r.data.filter(x=>x.status!=='rejected').forEach(x=>{(CL.reviews[x.hostel_id]=CL.reviews[x.hostel_id]||[]).push({...x.data,id:x.id,status:x.status==='approved'?'ok':'pending'})});
  mergeAreas();
}
async function upPhotos(list){
  const out=[];
  for(const p of list){
    if(!p.startsWith('data:')){out.push(p);continue}
    const b=await (await fetch(p)).blob(),path=`${ME.id}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
    const {error}=await sb.storage.from('photos').upload(path,b,{contentType:b.type||'image/jpeg'});if(error)throw error;
    out.push(sb.storage.from('photos').getPublicUrl(path).data.publicUrl);
  }
  return out;
}
async function cloudSubmitReview(hid,r,file){
  try{
    r.photos=await upPhotos(r.photos||[]);
    let rp=null;
    if(file){rp=`${ME.id}/${r.id}-${file.name.replace(/[^\w.-]/g,'_')}`;
      const u=await sb.storage.from('receipts').upload(rp,file);if(u.error)throw u.error}
    const {status,...data}=r;
    const ins=await sb.from('reviews').insert({id:r.id,hostel_id:hid,data,receipt_path:rp});if(ins.error)throw ins.error;
    if(IS_ADMIN)await sb.rpc('set_status',{tbl:'reviews',rid:r.id,new_status:'approved'});
    await cloudLoad();return true;
  }catch(e){toast('Could not send. '+(e.message||'Try again.'));return false}
}
function openSignIn(){
  const old=$('#signin');if(old)old.remove();
  const d=document.createElement('dialog');d.id='signin';
  d.innerHTML=`<form id="sf"><h3>Sign in</h3><p class="meta" style="margin:8px 0 14px">Enter your email. We send you a link. No password needed.</p>
    <div class="field"><label for="se">Email</label><input type="text" id="se" inputmode="email" autocomplete="email" required></div>
    <div class="row"><button type="button" class="btn ghost" id="sc">Cancel</button><button class="btn" type="submit">Send link</button></div><p class="meta" id="sm" role="status"></p></form>`;
  document.body.appendChild(d);d.showModal();
  $('#sc').onclick=()=>d.close();
  $('#sf').onsubmit=async e=>{e.preventDefault();
    const {error}=await sb.auth.signInWithOtp({email:$('#se').value.trim(),options:{emailRedirectTo:location.origin+location.pathname}});
    $('#sm').textContent=error?'Could not send the link: '+error.message:'Check your email and open the link.'};
}
function authUI(){
  $('#auth').hidden=!cloudOn();$('#auth').textContent=ME?'Sign out':'Sign in';$('#adminLink').hidden=!IS_ADMIN;
}
async function initCloud(){
  $('#auth').onclick=()=>{ME?sb.auth.signOut():openSignIn()};
  if(!(CLOUD.url&&CLOUD.key&&window.supabase)){authUI();return}
  sb=window.supabase.createClient(CLOUD.url,CLOUD.key,{auth:{flowType:'pkce'}});
  const setMe=async s=>{ME=s?s.user:null;IS_ADMIN=false;if(ME){const r=await sb.rpc('is_admin');IS_ADMIN=r.data===true}authUI()};
  const {data}=await sb.auth.getSession();await setMe(data.session);
  if(location.search)history.replaceState(null,'',location.pathname+location.hash);
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(async()=>{await setMe(s);await cloudLoad();route()},0)});
  await cloudLoad();
}
async function admin(){
  if(!IS_ADMIN){view.innerHTML=`<section class="how"><div class="wrap"><h1 style="font-size:2rem">Review queue</h1><p class="meta">This page is for admins. ${cloudOn()?'Sign in with an admin account.':'The shared backend is not set up yet.'}</p></div></section>`;return}
  view.innerHTML=`<section class="how"><div class="wrap"><a class="back" href="#home">Back to search</a><h1 style="font-size:2rem">Review queue</h1><p class="meta" id="aq">Loading...</p><div id="aqq"></div></div></section>`;
  const [h,r]=await Promise.all([sb.from('hostels').select('id,data,created_at').eq('status','pending').order('created_at'),sb.from('reviews').select('id,hostel_id,data,receipt_path,created_at').eq('status','pending').order('created_at')]);
  if(h.error||r.error){$('#aq').textContent='Could not load the queue.';return}
  $('#aq').textContent=`${h.data.length} hostel${h.data.length===1?'':'s'} and ${r.data.length} review${r.data.length===1?'':'s'} waiting.`;
  const nm=id=>(findHostel(id)||{}).name||id;
  const btns=(t,id)=>`<div class="row" style="margin-top:12px"><button class="btn" data-a="${t}|${id}|approved">Approve</button><button class="btn ghost" data-a="${t}|${id}|rejected">Reject</button></div>`;
  $('#aqq').innerHTML=h.data.map(x=>`<div class="panel"><h3>New hostel: ${esc(x.data.name)}</h3><p class="meta">${esc(x.data.ar)}, ${esc(x.data.rg)}, ${esc(x.data.st)}. ${(x.data.rooms||[]).map(y=>esc(y.t)+' '+naira(y.p)).join(', ')}</p>${btns('hostels',x.id)}</div>`).join('')
   +r.data.map(x=>`<div class="panel"><h3>Review for ${esc(nm(x.hostel_id))}</h3><p class="meta">${esc(x.data.n||'')}, paid ${esc(x.data.paid||'')}, ${esc(x.data.stay||'')}, ${x.data.rate} stars</p><p>${esc(x.data.text||'')}</p>${x.receipt_path?`<button class="btn sec" data-rc="${esc(x.receipt_path)}">View receipt</button>`:'<p class="meta">No receipt attached.</p>'}${btns('reviews',x.id)}</div>`).join('');
  view.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    const [t,id,st]=b.dataset.a.split('|');let why=null;
    if(st==='rejected'){why=prompt('Reason for rejecting (kept private):');if(why===null)return}
    const {error}=await sb.rpc('set_status',{tbl:t,rid:id,new_status:st,why});
    if(error){toast(error.message);return}
    await cloudLoad();admin()});
  view.querySelectorAll('[data-rc]').forEach(b=>b.onclick=async()=>{
    const {data,error}=await sb.storage.from('receipts').createSignedUrl(b.dataset.rc,120);
    if(error){toast('Could not open the receipt.');return}
    window.open(data.signedUrl,'_blank','noopener')});
}

/* ---------- Data helpers ---------- */
function eff(h){
  const reviews=(h.reviews||[]).concat(DB.reviews[h.id]||[]).concat(CL.reviews[h.id]||[]);
  let score=h.score,r=h.r;
  if(h.mine){
    const ok=reviews.filter(x=>x.status==='ok');
    if(ok.length){score=Math.round(ok.reduce((a,x)=>a+x.rate,0)/ok.length*20);r={};
      CAT.forEach(k=>{const v=ok.filter(x=>x.ratings&&x.ratings[k]);r[k]=v.length?Math.round(v.reduce((a,x)=>a+x.ratings[k],0)/v.length*20):0})}
    else{score=null;r=null}
  }
  const ed=(DB.edits||{})[h.id]||{};
  return {...h,photos:ed.photos||h.photos||[],hist:ed.hist||h.hist||null,reviews,score,r,verified:reviews.filter(x=>x.status!=='pending').length};
}
const allHostels=()=>(DB.settings.hideSamples?[]:SEED).concat(DB.hostels).concat(CL.hostels).map(eff);
const findHostel=id=>allHostels().find(h=>h.id===id);
const fmtMonth=v=>{if(!v)return'';const d=new Date(v+'-01T00:00:00');return d.toLocaleString('en-GB',{month:'short',year:'numeric'})};
const shortName=n=>{const p=String(n).trim().split(/\s+/);return p.length>1?`${p[0]} ${p[p.length-1][0].toUpperCase()}.`:p[0]};

/* Compress a chosen photo so many fit on the device */
function shrink(file,max=1000,q=.72){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.src=r.result};r.readAsDataURL(file)})}

/* Linked State > Region > Area dropdowns. With "other", people can type an area that is not listed. */
function cascade(p,onChange,other){
  const st=$('#'+p+'St'),rg=$('#'+p+'Rg'),ar=$('#'+p+'Ar');
  const fill=(el,items,ph,extra)=>{el.innerHTML=`<option value="">${ph}</option>`+items.map(x=>`<option>${esc(x)}</option>`).join('')+(extra?'<option value="__other">Other area (type it)</option>':'');el.disabled=!items.length&&!extra};
  fill(st,Object.keys(LOC).sort(),other?'Choose a state':'All states');st.disabled=false;
  fill(rg,[],'Choose a state first');fill(ar,[],'Choose a region first');
  st.onchange=()=>{fill(rg,st.value?Object.keys(LOC[st.value]).sort():[],st.value?(other?'Choose a region':'All regions'):'Choose a state first');fill(ar,[],'Choose a region first');onChange&&onChange()};
  rg.onchange=()=>{fill(ar,rg.value?LOC[st.value][rg.value]:[],rg.value?(other?'Choose an area':'All areas'):'Choose a region first',other&&rg.value);onChange&&onChange()};
  ar.onchange=()=>onChange&&onChange();
}
const locSelects=p=>`<div class="locs">
  <div><label for="${p}St">State</label><select id="${p}St"></select></div>
  <div><label for="${p}Rg">Region</label><select id="${p}Rg" disabled></select></div>
  <div><label for="${p}Ar">Area</label><select id="${p}Ar" disabled></select></div></div>`;

function results(){
  if(!S.active){location.hash='#home';return}
  const SORTL={score:'Highest trust score first',low:'Lowest trust score first',pup:'Price, low to high',pdn:'Price, high to low',road:'Closest to main road first',near:'Nearest to me first'};
  const CRIT={
    trust:{t:'Trust score',o:[['score','Highest first'],['low','Lowest first'],['t75','Trusted only (75+)'],['t50','Mixed or better (50+)']]},
    price:{t:'Price',o:[['pup','Low to high'],['pdn','High to low'],['range','Within a range']]},
    road:{t:'Distance to main road',o:[['road','Closest first'],['r150','Within 150 m'],['r300','Within 300 m'],['r500','Within 500 m']]},
    type:{t:'Room type',o:ROOM_TYPES.map(t=>[t,t])},
    amen:{t:'Amenities',o:Object.entries(AM)},
    ...(S.near?{near:{t:'Distance from me',o:[['near','Nearest first']]}}:{})
  };
  view.innerHTML=`<div class="wrap page">
    <a class="back" href="#home">Change search</a>
    <h1 id="rh" style="font-size:clamp(1.7rem,3.6vw,2.4rem)"></h1>
    <div class="tools">
      <div class="top">
        <div><label class="mini" for="crit">Sort by</label>
          <select id="crit"><option value="">Choose an option</option>${Object.entries(CRIT).map(([k,c])=>`<option value="${k}">${c.t}</option>`).join('')}</select></div>
        <div class="val" id="val" hidden></div>
        <span class="count" id="cnt" aria-live="polite"></span>
      </div>
      <div class="chiprow" id="chips"></div>
    </div>
    <div class="grid" id="grid"></div>
  </div>`;
  const where=[S.ar,S.rg,S.st].filter(Boolean).join(', ');
  $('#rh').textContent=S.near?'Hostels near you':(where?`Hostels in ${where}`:(S.q?`Results for "${S.q}"`:'All hostels'));

  const chipList=()=>{
    const c=[];
    if(S.sortOn)c.push({l:'Sort: '+SORTL[S.sort],x:()=>{S.sortOn=false;S.sort='score'}});
    if(S.min||S.max)c.push({l:`Price: ${num(S.min)?naira(num(S.min)):'any'} to ${num(S.max)?naira(num(S.max)):'any'}`,x:()=>{S.min='';S.max=''}});
    if(S.trust)c.push({l:S.trust>=75?'Trusted only (75+)':'Mixed or better (50+)',x:()=>{S.trust=0}});
    if(S.road)c.push({l:`Within ${S.road} m of main road`,x:()=>{S.road=0}});
    S.types.forEach(t=>c.push({l:t,x:()=>{S.types=S.types.filter(y=>y!==t)}}));
    S.amen.forEach(a=>c.push({l:AM[a],x:()=>{S.amen=S.amen.filter(y=>y!==a)}}));
    return c;
  };
  const draw=()=>{
    const lo=num(S.min),hi=num(S.max),q=S.q.toLowerCase();
    let l=allHostels().map(h=>{
      const m=h.rooms.filter(r=>(!S.types.length||S.types.includes(r.t))&&(!lo||r.p>=lo)&&(!hi||r.p<=hi));
      return {...h,m,shown:m.length?Math.min(...m.map(r=>r.p)):0,d:(S.near&&h.lat!=null)?km(S.near.lat,S.near.lng,h.lat,h.lng):null};
    }).filter(h=>h.name.toLowerCase().includes(q)&&(!S.st||h.st===S.st)&&(!S.rg||h.rg===S.rg)&&(!S.ar||h.ar===S.ar)
      &&(!S.near||h.d!==null)&&h.m.length
      &&(!S.trust||(h.score!==null&&h.score>=S.trust))
      &&(!S.road||(h.road!=null&&h.road<=S.road))&&S.amen.every(a=>h.amen.includes(a)));
    const by={score:(a,b)=>(b.score??-1)-(a.score??-1),low:(a,b)=>(a.score??101)-(b.score??101),pup:(a,b)=>a.shown-b.shown,pdn:(a,b)=>b.shown-a.shown,road:(a,b)=>(a.road??1e9)-(b.road??1e9),near:(a,b)=>a.d-b.d};
    l.sort(by[S.sort]||by.score);
    let far=false;if(S.near){const c=l.filter(h=>h.d<=NEAR_KM);if(c.length)l=c;else far=l.length>0}
    const ch=chipList();
    $('#chips').innerHTML=ch.map((c,i)=>`<span class="chip">${esc(c.l)}<button type="button" data-i="${i}" aria-label="Remove ${esc(c.l)}"><svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true"><path d="M2 2l6 6M8 2L2 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></span>`).join('')+(ch.length>1?'<button type="button" class="clearall" id="clr">Clear all</button>':'');
    document.querySelectorAll('.chip button').forEach(b=>b.onclick=()=>{ch[+b.dataset.i].x();draw()});
    const ca=$('#clr');if(ca)ca.onclick=()=>{Object.assign(S,{min:'',max:'',trust:0,types:[],road:0,amen:[],sortOn:false,sort:'score'});draw()};
    $('#cnt').textContent=`${l.length} hostel${l.length===1?'':'s'} found${far?`. None within ${NEAR_KM} km of you, so these are the nearest.`:''}`;
    $('#grid').innerHTML=l.length?l.map(h=>{
      const tys=[...new Set(h.rooms.map(r=>r.t))];
      return `<article class="card"><div class="photo">${pic(h,0)}</div>
        <div class="body"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center">
          <div><h3>${esc(h.name)}</h3><div class="meta">${esc(h.ar)}, ${esc(h.rg)}, ${esc(h.st)}</div>
          ${h.d!==null?`<div class="dist">${h.d<1?'Under 1':Math.round(h.d)} km from you</div>`:''}
          ${h.road!=null?`<div class="meta">${h.road} m from the main road</div>`:''}</div>${ring(h.score)}</div>
          <div><span class="pill ${cls(h.score)}">${label(h.score)}</span> ${h.mine?'<span class="pill draft">Draft</span>':'<span class="pill sample">Sample</span>'}</div>
          <div>${tys.slice(0,3).map(t=>`<span class="pill">${esc(t)}</span>`).join(' ')}${tys.length>3?` <span class="note">+${tys.length-3} more</span>`:''}</div>
          <div class="foot"><span><span class="meta">${h.m.length>1?'From ':''}</span><b>${naira(h.shown)}</b> <span class="meta">a year</span></span><a class="open" href="#h-${esc(h.id)}">${h.verified?`Read ${h.verified} review${h.verified>1?'s':''}`:'See details'}</a></div>
        </div></article>`}).join('')
      :`<div class="empty">${S.near&&!ch.length?`No hostels within ${NEAR_KM} km of you yet.`:'No hostels match all of these.'} Remove a filter above, <a href="#home">change your search</a>, or <a href="#add">add a hostel</a>.</div>`;
  };

  $('#crit').onchange=()=>{
    const k=$('#crit').value,v=$('#val');
    if(!k){v.hidden=true;v.innerHTML='';return}
    v.hidden=false;
    v.innerHTML=`<div><label class="mini" for="opt">${CRIT[k].t}</label><select id="opt">${CRIT[k].o.map(([a,b])=>`<option value="${esc(a)}">${esc(b)}</option>`).join('')}</select></div>
      <span id="rng" hidden class="val"><div><label class="mini" for="rlo">From (₦)</label><input type="text" id="rlo" inputmode="numeric" placeholder="100,000"></div><div><label class="mini" for="rhi">To (₦)</label><input type="text" id="rhi" inputmode="numeric" placeholder="250,000"></div></span>
      <button type="button" class="btn add" id="addBtn">Add</button>`;
    const opt=$('#opt');
    opt.onchange=()=>{$('#rng').hidden=opt.value!=='range'};
    $('#addBtn').onclick=()=>{
      const o=opt.value;
      if(k==='trust'){ if(o==='score'||o==='low'){S.sort=o;S.sortOn=true}else S.trust=o==='t75'?75:50 }
      else if(k==='price'){ if(o==='range'){ if(!num($('#rlo').value)&&!num($('#rhi').value)){toast('Enter a lowest or highest price.');return} S.min=$('#rlo').value;S.max=$('#rhi').value } else {S.sort=o;S.sortOn=true} }
      else if(k==='road'){ if(o==='road'){S.sort='road';S.sortOn=true}else S.road=+o.slice(1) }
      else if(k==='type'){ if(!S.types.includes(o))S.types.push(o) }
      else if(k==='amen'){ if(!S.amen.includes(o))S.amen.push(o) }
      else if(k==='near'){S.sort='near';S.sortOn=true}
      $('#crit').value='';v.hidden=true;v.innerHTML='';draw();
    };
  };
  draw();
}

/* Rent history chart (inline SVG, works offline) */
function rentChart(h){
  const hs=h.hist,p=hs&&hs.pts?hs.pts.filter(x=>x[1]>0).sort((a,b)=>a[0]-b[0]):[];
  const box=c=>`<div class="panel" style="margin-bottom:22px"><h3 style="font-size:1.2rem">Rent over time</h3>${c}</div>`;
  if(p.length<2)return box('<p class="note">No rent history yet. Press "Change photos or rent history" to add past prices.</p>');
  const W=520,H=230,l=60,r=16,t=14,b=32,mn=Math.min(...p.map(x=>x[1]))*.8,mx=Math.max(...p.map(x=>x[1]))*1.05;
  const X=i=>l+i*(W-l-r)/(p.length-1),Y=v=>t+(H-t-b)*(1-(v-mn)/(mx-mn));
  const grid=[0,1,2,3].map(k=>{const v=mn+(mx-mn)*k/3;return `<line x1="${l}" x2="${W-r}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" style="fill:var(--muted)">₦${Math.round(v/1000)}k</text>`}).join('');
  const line=p.map((x,i)=>`${X(i)},${Y(x[1])}`).join(' ');
  const dots=p.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x[1])}" r="4.5" fill="#F2A900" style="stroke:var(--brand)" stroke-width="1.5"><title>${x[0]}: ${naira(x[1])}</title></circle><text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="11" style="fill:var(--muted)">${x[0]}</text>`).join('');
  const ch=Math.round((p[p.length-1][1]/p[0][1]-1)*100);
  return box(`<p class="note" style="margin:4px 0 8px">${esc(hs.room)}, per year. Tap or hover the chart to see the exact rent for a year. ${ch>=0?'Up':'Down'} ${Math.abs(ch)}% from ${p[0][0]} to ${p[p.length-1][0]}.${hs.sample?' Sample figures, not real.':''}</p><svg id="rc" tabindex="0" data-pts="${JSON.stringify(p.map((x,i)=>[Math.round(X(i)),Math.round(Y(x[1])),x[0],x[1]]))}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Yearly rent for ${esc(hs.room)}, ${naira(p[0][1])} in ${p[0][0]} to ${naira(p[p.length-1][1])} in ${p[p.length-1][0]}" style="width:100%;height:auto;cursor:crosshair;touch-action:pan-y">${grid}<polyline points="${line}" fill="none" style="stroke:var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>${dots}<g id="xh" pointer-events="none"></g></svg>`);
}

/* Crosshair: hover, tap or use arrow keys to read the exact rent */
function wireChart(){
  const s=$('#rc');if(!s)return;
  const P=JSON.parse(s.dataset.pts),W=520,H=230,g=$('#xh');
  const show=i=>{const [x,y,yr,v]=P[i],txt=yr+': '+naira(v),w=txt.length*7.4+18,bx=Math.min(Math.max(x-w/2,4),W-w-4),by=y>58?y-46:y+16;
    g.innerHTML=`<line x1="${x}" x2="${x}" y1="14" y2="${H-32}" style="stroke:var(--brand)" stroke-dasharray="4 3"/><line x1="60" x2="${W-16}" y1="${y}" y2="${y}" style="stroke:var(--brand)" stroke-dasharray="4 3"/><circle cx="${x}" cy="${y}" r="7" fill="#F2A900" style="stroke:var(--brand)" stroke-width="2.5"/><rect x="${bx}" y="${by}" width="${w}" height="30" rx="6" style="fill:var(--brand)"/><text x="${bx+w/2}" y="${by+20}" text-anchor="middle" font-size="13" font-weight="700" style="fill:var(--on-brand)">${txt}</text>`;s.dataset.i=i};
  const near=e=>{const r=s.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;let k=0;P.forEach((p,i)=>{if(Math.abs(p[0]-x)<Math.abs(P[k][0]-x))k=i});return k};
  s.onpointermove=e=>show(near(e));s.onpointerdown=e=>show(near(e));
  s.onkeydown=e=>{const i=+(s.dataset.i??-1);if(e.key==='ArrowRight'){show(Math.min(P.length-1,i+1));e.preventDefault()}else if(e.key==='ArrowLeft'){show(Math.max(0,i<0?0:i-1));e.preventDefault()}};
  show(P.length-1);
}

/* Photo picker that compresses images and shows removable thumbnails */
function photoPicker(inputId,thumbId,max,list){
  const inp=$('#'+inputId),box=$('#'+thumbId);
  const draw=()=>{box.innerHTML=list.map((s,i)=>`<div><img src="${s}" alt="Selected photo ${i+1}"><button type="button" data-i="${i}" aria-label="Remove photo ${i+1}">✕</button></div>`).join('');
    box.querySelectorAll('button').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.i,1);draw()})};
  inp.onchange=async()=>{
    const files=[...inp.files].slice(0,Math.max(0,max-list.length));
    if(inp.files.length>files.length)toast(`You can add up to ${max} photos.`);
    for(const f of files){try{list.push(await shrink(f))}catch(e){toast('One photo could not be read.')}}
    inp.value='';draw();
  };
  draw();
}

  const btn=$('#mbtn'),menu=$('#menu');
  const ICON={open:'<path d="M5 5l14 14M19 5L5 19"/>',closed:'<path d="M4 7h16M4 12h16M4 17h16"/>'};
  const set=o=>{menu.classList.toggle('open',o);btn.setAttribute('aria-expanded',o);btn.setAttribute('aria-label',o?'Close menu':'Open menu');btn.firstChild.innerHTML=o?ICON.open:ICON.closed};
  btn.onclick=()=>set(!menu.classList.contains('open'));
  menu.addEventListener('click',e=>{if(e.target.closest('a,button'))set(false)});
  document.addEventListener('click',e=>{const pth=e.composedPath();if(!pth.includes(btn)&&!pth.includes(menu))set(false)});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu.classList.contains('open')){set(false);btn.focus()}});
  addEventListener('hashchange',()=>set(false));
})();

/* ---------- Footer tools ---------- */
function syncTools(){$('#oOwn').checked=DB.settings.owner;$('#oHide').checked=DB.settings.hideSamples}
$('#oOwn').onchange=async e=>{DB.settings.owner=e.target.checked;await persist();route()};
$('#oHide').onchange=async e=>{DB.settings.hideSamples=e.target.checked;await persist();route()};
$('#oExp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB)],{type:'application/json'}));a.download='heads-up-data.json';document.body.appendChild(a);a.click();a.remove();toast('Data exported. Keep the file safe.')};
$('#oImp').onclick=()=>$('#impF').click();
$('#impF').onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const v=JSON.parse(await f.text());if(!v||!Array.isArray(v.hostels))throw 0;setDB(v);await persist();syncTools();route();toast('Data imported.')}catch(x){toast('That file is not a Heads Up data file.')}
  e.target.value=''};
$('#oRst').onclick=async()=>{if(!confirm('Delete everything you added on this device? Sample hostels stay.'))return;setDB({});await persist();syncTools();location.hash='#home';route()};

$('#cCancel').onclick=()=>$('#challenge').close();
$('#challengeForm').onsubmit=e=>{e.preventDefault();$('#challenge').close();$('#cWhy').value='';toast('Challenge sent. The review stays up while we check it.')};

(async()=>{
  await load();
  try{await Promise.race([initCloud(),new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),6000))])}
  catch(e){sb=null;ME=null;IS_ADMIN=false;CL={hostels:[],reviews:{}};authUI()}
  syncTools();route();
})();
</script>
</body>
</html>
